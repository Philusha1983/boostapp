<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boost Auto-Book — History</title>
<meta name="theme-color" content="#00e0a0">
<link rel="icon" type="image/png" sizes="192x192" href="icons/appicon192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Rubik', 'Noto Sans Arabic', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    --green:#00e0a0; --green-deep:#00a87a; --ink:#063a2b; --red:#c0392b; --gold:#e6b800;
    --bg:#f5f7f6; --card:#ffffff; --line:#e3e6e0; --text:#1f2a17; --muted:#6b7280;
    --ghost:#eef0ec; --ghost-hover:#e0e4dc; --hover:#f3faf7;
    --heat1:#cdf3e4; --heat2:#7fe0bf; --heat3:#2fc496; --heat4:#00a87a;
    /* Per-tier text colors for heatmap cells — picked per actual background
       luminance, not just re-using --ink/--text, since the two lightest and
       two darkest tiers need opposite foreground colors from each other. */
    --heatfg1:var(--ink); --heatfg2:var(--ink); --heatfg3:#ffffff; --heatfg4:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.04);
    --up:#1ec871; --down:#e08a2b;
    --sticky-top:60px;
  }
  html[data-theme="dark"] {
    --bg:#10171a; --card:#1a2427; --line:#2b3a3d; --text:#e7eeec; --muted:#9aa6a2;
    --ghost:#243133; --ghost-hover:#2e3d40; --hover:#1d2a2c;
    --heat1:#123027; --heat2:#175f44; --heat3:#1c9268; --heat4:#22c98e;
    /* heat1/heat2/heat3 are all still fairly dark in this theme, so they need
       light text; heat4 is the brightest tile of the set, so it flips to
       dark text — using --ink (a dark green meant for light theme) here for
       every tier was the bug: it was unreadable against heat1/heat2. */
    --heatfg1:#eafff5; --heatfg2:#eafff5; --heatfg3:#eafff5; --heatfg4:#06140f;
    --green-deep:#19c99c; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; font-family:var(--font); }
  body { margin:0; background:var(--bg); color:var(--text); }
  header { background:var(--green); color:var(--ink); padding:12px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  header h1 { font-size:17px; margin:0; font-weight:700; display:flex; align-items:center; gap:8px; }
  header .actions { display:flex; gap:8px; align-items:center; font-size:12px; flex-wrap:wrap; }
  button { cursor:pointer; border:none; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; background:rgba(0,0,0,.14); color:var(--ink); }
  button:hover { background:rgba(0,0,0,.22); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:var(--ink); color:var(--green); }
  button.primary:hover { filter:brightness(1.2); }
  header select { border:none; border-radius:8px; padding:7px 8px; font-size:12.5px; font-weight:600; background:rgba(0,0,0,.14); color:var(--ink); }
  .sharegroup { display:flex; gap:0; }
  .sharegroup select { border-inline-end:1px solid rgba(0,0,0,.18); border-radius:8px 0 0 8px; }
  .sharegroup button { border-radius:0 8px 8px 0; }
  html[dir="rtl"] .sharegroup select { border-radius:0 8px 8px 0; }
  html[dir="rtl"] .sharegroup button { border-radius:8px 0 0 8px; }
  main { max-width:1080px; margin:0 auto; padding:20px 22px 60px; }
  .loading, .empty { text-align:center; color:var(--muted); padding:70px 20px; font-size:14px; }
  .subnote { color:var(--muted); font-size:12px; margin:2px 0 20px; }
  .hidden { display:none !important; }

  /* Mobile header: force the title onto its own line, then let the toolbar
     of buttons/selects scroll horizontally instead of wrapping into a tall
     multi-row stack. updateStickyOffsets() (history.js) re-measures the
     header's real height after this layout change, so the sticky filter bar
     below still lines up correctly. */
  @media (max-width:640px) {
    header { padding:10px 14px; gap:8px; }
    header h1 { flex:1 1 100%; font-size:15px; }
    header .actions { flex-wrap:nowrap; overflow-x:auto; width:100%; justify-content:flex-start; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
    header .actions > * { flex:0 0 auto; }
    header .viewtabs { flex:0 0 auto; }
    button, header select { padding:6px 10px; font-size:12px; white-space:nowrap; }
  }
  @media (max-width:480px) {
    main { padding:14px 12px 48px; }
  }

  /* View switcher */
  .viewtabs { display:flex; gap:4px; background:rgba(0,0,0,.12); border-radius:9px; padding:3px; }
  .viewtabs button { background:transparent; color:var(--ink); opacity:.75; padding:6px 12px; }
  .viewtabs button.active { background:var(--ink); color:var(--green); opacity:1; }

  /* User card + persona */
  .usercard { display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); flex-wrap:wrap; }
  .uc-avatar { width:58px; height:58px; border-radius:50%; overflow:hidden; background:var(--ghost); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:var(--green-deep); }
  .uc-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .uc-main { flex:1 1 220px; min-width:180px; }
  .uc-name { font-size:18px; font-weight:800; }
  .uc-since { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .uc-persona { flex:1 1 260px; min-width:220px; background:linear-gradient(135deg, var(--green), var(--green-deep)); color:var(--ink); border-radius:12px; padding:12px 16px; }
  .uc-persona .pt { font-size:15px; font-weight:800; }
  .uc-persona .ps { font-size:12px; opacity:.85; margin-top:2px; }

  /* Badges (flip cards) */
  .badges { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:760px) { .badges { grid-template-columns:repeat(2,1fr); } }
  .badge { perspective:1200px; height:190px; }
  .badge-inner { position:relative; width:100%; height:100%; cursor:pointer; transition:transform .55s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; }
  .badge.flipped .badge-inner { transform:rotateY(180deg); }
  .badge-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:14px; padding:14px 12px; box-shadow:var(--shadow); background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .badge-front { opacity:.45; filter:grayscale(.65); }
  .badge.earned .badge-front { opacity:1; filter:none; border-color:var(--green-deep); }
  .badge-front .bi { font-size:32px; line-height:1; }
  .badge-front .bt { font-size:12.5px; font-weight:700; margin-top:8px; }
  .badge-front .bp { font-size:11px; color:var(--muted); margin-top:4px; }
  .badge-front .bbar { background:var(--ghost); border-radius:99px; height:5px; margin-top:8px; width:78%; overflow:hidden; }
  .badge-front .bbar i { display:block; height:100%; background:var(--green-deep); }
  .badge-front .bexp { font-size:9.5px; color:var(--green-deep); margin-top:10px; font-weight:700; }
  .badge-back { transform:rotateY(180deg); justify-content:flex-start; padding-top:18px; }
  .badge.earned .badge-back { border-color:var(--green-deep); }
  .badge-back .bb-icon { font-size:19px; }
  .badge-back .bb-title { font-size:11.5px; font-weight:800; margin-top:4px; }
  .badge-back .bb-desc { font-size:10.5px; color:var(--muted); line-height:1.4; margin-top:6px; }
  .badge-back .bb-status { font-size:11.5px; font-weight:700; margin-top:auto; padding-top:8px; }
  .badge-back .bb-status.on { color:var(--green-deep); }
  .badge-back .bb-status.off { color:var(--muted); }

  /* Actionable insights (4-card grid) */
  .insightgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:8px; align-items:stretch; }
  @media (max-width:960px) { .insightgrid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px) { .insightgrid { grid-template-columns:1fr; } }
  .insightgrid.single { grid-template-columns:1fr; }
  .insight { display:flex; flex-direction:column; align-items:flex-start; gap:8px; background:var(--card); border:1px solid var(--line); border-top:4px solid var(--gold); border-radius:10px; padding:14px; box-shadow:var(--shadow); }
  .insight .ii { font-size:22px; }
  .insight .it { font-size:12.5px; line-height:1.5; flex:1 1 auto; }
  .insight .it b { color:var(--text); }
  .insight button { align-self:stretch; margin-top:auto; }
  .insight.ok { border-top-color:var(--green-deep); }

  /* Filters — grouped rows, sticky below header */
  .filterbar { position:sticky; top:var(--sticky-top); z-index:15; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 16px; margin-bottom:18px; box-shadow:var(--shadow); }
  .filter-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 0; }
  .filter-row + .filter-row { border-top:1px solid var(--line); }
  .filter-label { flex:0 0 90px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .chipgroup { display:flex; gap:6px; flex-wrap:wrap; flex:1 1 auto; }
  .chip { border:1px solid var(--line); background:var(--ghost); color:var(--text); border-radius:99px; padding:5px 12px; font-size:12.5px; font-weight:500; cursor:pointer; }
  .chip:hover { background:var(--ghost-hover); }
  .chip.active { background:var(--green-deep); color:#fff; border-color:var(--green-deep); }

  /* Two clearly-labeled stat groups: one that tracks the active filter above
     (so its numbers visibly change when you switch range), one that's always
     an all-time fact (streaks, best month, etc. don't make sense sliced to a
     single month) — labeling them removes the "why did some boxes not
     change" confusion of a single flat, mixed grid. */
  .stats-groupline { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:700; margin:18px 0 8px; }
  .stats-groupline:first-of-type { margin-top:0; }
  .stats-groupline b { color:var(--green-deep); text-transform:none; letter-spacing:0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 14px; box-shadow:var(--shadow); }
  .stat .num { font-size:24px; font-weight:800; color:var(--green-deep); line-height:1.1; }
  .stat .lbl { font-size:12px; color:var(--muted); margin-top:4px; }
  .stat .delta { font-size:11px; font-weight:700; margin-top:3px; }
  .stat .delta.up { color:var(--up); } .stat .delta.down { color:var(--down); }

  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:26px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
  /* Grid items stretch to the row's height by default, but a plain block
     child (like .card) won't inherit that height on its own — it still sizes
     to its own content, so two cards with different content (e.g. a bar
     chart vs. a ring) end up visibly mismatched heights. Making each column
     a flex column and letting .card grow fills the stretched wrapper, so
     both cards in the row always match. */
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:stretch; }
  .grid2 > div { display:flex; flex-direction:column; min-height:0; }
  .grid2 > div > .card { flex:1 1 auto; }
  @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } .usercard{flex-direction:column; align-items:stretch; text-align:center;} }

  /* Combined "by class / by teacher / trend / journey" horizontal row.
     min-width:0 on the cards is load-bearing: without it, a grid item's
     default min-width:auto lets its widest child (e.g. the growth-curve SVG
     or a long unbroken label) blow the column past its 1fr share, which
     squeezes and misaligns the other three cards in the row.
     align-items:stretch makes all four card boxes the same height; a long
     by-teacher list would otherwise force its own card much taller than the
     other three, so its list content scrolls internally (.card-body) instead
     of dictating the row's height. */
  .quadgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:stretch; }
  @media (max-width:960px) { .quadgrid { grid-template-columns:1fr 1fr; } }
  @media (max-width:600px) { .quadgrid { grid-template-columns:1fr; } }
  .quadgrid .card { min-width:0; min-height:0; max-height:280px; display:flex; flex-direction:column; }
  .quadgrid .card-body { flex:1 1 auto; min-height:0; overflow-y:auto; }
  .subcard-title { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:700; margin-bottom:10px; flex:0 0 auto; }
  .growth-caption { font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:10px; }

  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px; }
  .bar-row .bl { flex:0 0 118px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .bt { flex:1 1 auto; background:var(--ghost); border-radius:6px; height:16px; position:relative; overflow:hidden; }
  .bar-row .bf { position:absolute; inset-inline-start:0; top:0; bottom:0; background:var(--green-deep); border-radius:6px; transition:width .4s ease; }
  .bar-row .bn { flex:0 0 28px; text-align:end; color:var(--muted); font-size:12px; font-weight:600; }

  .weekday-chart { display:flex; gap:8px; align-items:flex-end; height:140px; margin-top:6px; }
  .wd-col { flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .wd-bar { width:100%; max-width:36px; background:var(--green-deep); border-radius:6px 6px 3px 3px; transition:height .4s ease; min-height:2px; }
  .wd-n { font-size:11px; color:var(--muted); }
  .wd-lbl { font-size:11px; color:var(--muted); font-weight:600; }

  .month-trend { display:flex; gap:6px; align-items:flex-end; height:110px; overflow-x:auto; padding-bottom:2px; }
  .mt-col { flex:0 0 30px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; }
  .mt-bar { width:100%; background:var(--green-deep); border-radius:5px 5px 2px 2px; min-height:2px; }
  .mt-lbl { font-size:9.5px; color:var(--muted); white-space:nowrap; }

  .heatgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:14px; margin-top:6px; }
  .heatmonth { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; box-shadow:var(--shadow); }
  .heatmonth .hm-title { font-size:12.5px; font-weight:700; margin-bottom:7px; color:var(--text); }
  .hm-wd { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px; }
  .hm-wd span { font-size:9px; color:var(--muted); text-align:center; }
  .hm-days { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .hm-cell { aspect-ratio:1; border-radius:3px; background:var(--ghost); font-size:8.5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; color:var(--muted); }
  .hm-cell.h1 { background:var(--heat1); color:var(--heatfg1); }
  .hm-cell.h2 { background:var(--heat2); color:var(--heatfg2); }
  .hm-cell.h3 { background:var(--heat3); color:var(--heatfg3); }
  .hm-cell.h4 { background:var(--heat4); color:var(--heatfg4); }
  .hm-cell.empty-cell { background:transparent; }
  .hm-cell .hm-num { line-height:1; }
  .hm-cell .hm-mark { line-height:1; font-size:8px; color:currentColor; }

  /* Hour × weekday punch-card (continuous saturation, not banded) */
  .punchcard { overflow-x:auto; }
  .punch-grid { display:grid; gap:3px; min-width:560px; }
  .punch-hourrow { display:grid; gap:3px; align-items:center; }
  .punch-hlabel { font-size:9px; color:var(--muted); text-align:center; }
  .punch-wlabel { font-size:11px; color:var(--muted); font-weight:600; padding-inline-end:6px; text-align:end; }
  .punch-cell { aspect-ratio:1; border-radius:4px; background:var(--green-deep); min-width:16px; }
  .punch-cell.z { background:var(--ghost); }

  /* Cumulative growth curve */
  .growth-wrap { overflow-x:auto; }
  .growth-svg { display:block; }

  /* Consistency ring */
  .ringrow { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .ring-lbl { font-size:12.5px; color:var(--muted); }

  /* Compare view */
  .comparebar { display:flex; gap:16px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .comparebar select { padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; }
  .comparegrid { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; }
  .compareside { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
  .compareside h3 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; }
  .comparerow { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:13px; }
  .comparerow:first-of-type { border-top:none; }
  .comparevs { font-size:20px; font-weight:800; color:var(--muted); text-align:center; }
  /* Below 700px the two side-by-side compare cards get too narrow to read
     (labels/numbers start wrapping and colliding). DOM order is
     side A → VS → side B, so a single column stacks them in the same
     visual order, with VS becoming a horizontal divider between the two. */
  @media (max-width:700px) {
    .comparegrid { grid-template-columns:1fr; }
    .comparebar { flex-direction:column; align-items:stretch; }
    .comparebar select { width:100%; }
  }

  /* Story mode */
  .story-overlay { position:fixed; inset:0; background:linear-gradient(160deg,#04241b,#0c2b24 60%,#04241b); z-index:100; display:flex; flex-direction:column; color:#eafff5; }
  .story-dots { display:flex; gap:5px; padding:14px 18px 0; }
  .story-dots i { flex:1 1 0; height:3px; border-radius:99px; background:rgba(255,255,255,.22); overflow:hidden; }
  .story-dots i b { display:block; height:100%; width:0; background:#fff; }
  .story-dots i.done b { width:100%; }
  /* z-index:5 is required: .story-body below is also `position:relative` and
     comes later in the DOM, so without an explicit stacking order it paints
     on top of this button (both are "positioned, z-index:auto" — later DOM
     order wins) and silently swallows clicks meant for the close button. */
  .story-close { position:absolute; top:12px; inset-inline-end:16px; z-index:5; background:rgba(255,255,255,.14); color:#fff; border-radius:50%; width:32px; height:32px; padding:0; font-size:16px; }
  .story-body { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px; position:relative; }
  .story-slide { max-width:520px; animation:storyIn .35s ease; }
  @keyframes storyIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .story-eyebrow { font-size:13px; opacity:.7; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
  .story-big { font-size:52px; font-weight:800; color:var(--green); line-height:1.05; }
  .story-title { font-size:26px; font-weight:800; margin-top:6px; }
  .story-sub { font-size:15px; opacity:.85; margin-top:12px; line-height:1.6; }
  .story-avatar { width:80px; height:80px; border-radius:50%; margin:0 auto 16px; overflow:hidden; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; }
  .story-avatar img { width:100%; height:100%; object-fit:cover; }
  .story-nav { display:flex; justify-content:space-between; padding:0 18px 26px; }
  .story-nav button { background:rgba(255,255,255,.14); color:#fff; padding:9px 18px; }
  .story-nav button:hover { background:rgba(255,255,255,.24); }
  .story-badgegrid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:18px; }
  .story-badgegrid .sbi { font-size:24px; opacity:.35; }
  .story-badgegrid .sbi.on { opacity:1; }
  #confettiCanvas { position:fixed; inset:0; pointer-events:none; z-index:110; }
</style>
</head>
<body>
  <header>
    <h1><img src="icons/icon48.png" width="22" height="22" alt="" style="border-radius:5px;display:block;"><span data-i18n="title">Past Events</span></h1>
    <div class="actions">
      <div class="viewtabs" id="viewTabs">
        <button data-view="dashboard" class="active" data-i18n="viewDashboard">Dashboard</button>
        <button data-view="story" data-i18n="viewStory">Story</button>
        <button data-view="compare" data-i18n="viewCompare">Compare</button>
      </div>
      <span class="sharegroup">
        <select id="shareTemplate"></select>
        <button id="shareImgBtn" data-i18n="shareImg">🖼️ Share image</button>
      </span>
      <button id="exportCsvBtn" data-i18n="exportCsv">⬇️ Export CSV</button>
      <button id="refreshBtn" data-i18n="refresh">↻ Refresh</button>
      <button id="resyncBtn" data-i18n="resync">Resync all history</button>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="he">עברית</option>
